<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#fafafa"/>
  <text x="490" y="26" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold">Domain relations</text>

  <!-- User -->
  <g>
    <rect x="380" y="45" width="220" height="130" rx="4" fill="#fff" stroke="#8E44AD" stroke-width="1.5"/>
    <rect x="380" y="45" width="220" height="28" fill="#F5E8F8" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="490" y="64" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold">User</text>
    <line x1="380" y1="73" x2="600" y2="73" stroke="#8E44AD" stroke-width="1"/>
    <text x="392" y="94" font-family="Menlo,Consolas,monospace" font-size="11">+ id: UUID</text>
    <text x="392" y="114" font-family="Menlo,Consolas,monospace" font-size="11">+ name: str</text>
    <text x="392" y="134" font-family="Menlo,Consolas,monospace" font-size="11">+ email: str</text>
    <text x="392" y="154" font-family="Menlo,Consolas,monospace" font-size="11">+ created_at: datetime</text>
  </g>

  <!-- Project -->
  <g>
    <rect x="30" y="210" width="230" height="175" rx="4" fill="#fff" stroke="#2980B9" stroke-width="1.5"/>
    <rect x="30" y="210" width="230" height="28" fill="#E8F4FD" stroke="#2980B9" stroke-width="1.5"/>
    <text x="145" y="229" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold">Project</text>
    <line x1="30" y1="238" x2="260" y2="238" stroke="#2980B9" stroke-width="1"/>
    <text x="42" y="258" font-family="Menlo,Consolas,monospace" font-size="11">+ id: UUID</text>
    <text x="42" y="276" font-family="Menlo,Consolas,monospace" font-size="11">+ name: str</text>
    <text x="42" y="294" font-family="Menlo,Consolas,monospace" font-size="11">+ description: str</text>
    <text x="42" y="312" font-family="Menlo,Consolas,monospace" font-size="11">+ status: ProjectStatus</text>
    <text x="42" y="330" font-family="Menlo,Consolas,monospace" font-size="11">+ owner_id: UUID? (FK)</text>
    <text x="42" y="348" font-family="Menlo,Consolas,monospace" font-size="11">+ created_at: datetime</text>
    <text x="42" y="368" font-family="Menlo,Consolas,monospace" font-size="11">+ tasks: Task[*]</text>
  </g>

  <!-- Task -->
  <g>
    <rect x="360" y="200" width="250" height="200" rx="4" fill="#fff" stroke="#1E8449" stroke-width="1.5"/>
    <rect x="360" y="200" width="250" height="28" fill="#E8F8E8" stroke="#1E8449" stroke-width="1.5"/>
    <text x="485" y="219" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold">Task</text>
    <line x1="360" y1="228" x2="610" y2="228" stroke="#1E8449" stroke-width="1"/>
    <text x="372" y="248" font-family="Menlo,Consolas,monospace" font-size="11">+ id: UUID</text>
    <text x="372" y="266" font-family="Menlo,Consolas,monospace" font-size="11">+ title / description</text>
    <text x="372" y="284" font-family="Menlo,Consolas,monospace" font-size="11">+ status / priority</text>
    <text x="372" y="302" font-family="Menlo,Consolas,monospace" font-size="11">+ project_id: UUID (FK)</text>
    <text x="372" y="320" font-family="Menlo,Consolas,monospace" font-size="11">+ assignee_id: UUID? (FK)</text>
    <text x="372" y="338" font-family="Menlo,Consolas,monospace" font-size="11">+ created_at / due_date?</text>
    <text x="372" y="360" font-family="Menlo,Consolas,monospace" font-size="11">+ comments: Comment[*]</text>
  </g>

  <!-- Comment -->
  <g>
    <rect x="720" y="220" width="230" height="155" rx="4" fill="#fff" stroke="#D68910" stroke-width="1.5"/>
    <rect x="720" y="220" width="230" height="28" fill="#FFF4E5" stroke="#D68910" stroke-width="1.5"/>
    <text x="835" y="239" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold">Comment</text>
    <line x1="720" y1="248" x2="950" y2="248" stroke="#D68910" stroke-width="1"/>
    <text x="732" y="270" font-family="Menlo,Consolas,monospace" font-size="11">+ id: UUID</text>
    <text x="732" y="290" font-family="Menlo,Consolas,monospace" font-size="11">+ body: str</text>
    <text x="732" y="310" font-family="Menlo,Consolas,monospace" font-size="11">+ author_id: UUID? (FK)</text>
    <text x="732" y="330" font-family="Menlo,Consolas,monospace" font-size="11">+ task_id: UUID (FK)</text>
    <text x="732" y="350" font-family="Menlo,Consolas,monospace" font-size="11">+ created_at: datetime</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- User → Project (owner) -->
  <path d="M420 175 L145 210" fill="none" stroke="#8E44AD" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="250" y="185" font-family="Helvetica,Arial" font-size="10" fill="#8E44AD">owns (SET NULL)</text>

  <!-- User → Task (assignee) -->
  <line x1="490" y1="175" x2="490" y2="200" stroke="#8E44AD" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="500" y="190" font-family="Helvetica,Arial" font-size="10" fill="#8E44AD">assignee</text>

  <!-- User → Comment (author) -->
  <path d="M560 175 L835 220" fill="none" stroke="#8E44AD" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="720" y="185" font-family="Helvetica,Arial" font-size="10" fill="#8E44AD">authors (SET NULL)</text>

  <!-- Project 1 — * Task -->
  <line x1="260" y1="290" x2="360" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="282" font-family="Helvetica,Arial" font-size="11">1</text>
  <text x="340" y="282" font-family="Helvetica,Arial" font-size="11">*</text>
  <text x="310" y="308" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#666">CASCADE</text>

  <!-- Task 1 — * Comment -->
  <line x1="610" y1="290" x2="720" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="282" font-family="Helvetica,Arial" font-size="11">1</text>
  <text x="700" y="282" font-family="Helvetica,Arial" font-size="11">*</text>
  <text x="665" y="308" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#666">CASCADE</text>

  <text x="490" y="410" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#666">Solid: ownership cascade · Dashed: optional User links (SET NULL on delete)</text>
</svg>
